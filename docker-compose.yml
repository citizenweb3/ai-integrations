services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bizdev-postgres
    environment:
      POSTGRES_USER: bizdev
      POSTGRES_PASSWORD: bizdev
      POSTGRES_DB: bizdev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bizdev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizdev -d bizdev"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      DATABASE_URL: postgres://bizdev:bizdev@postgres:5432/bizdev
      DASHBOARD_PORT: 3000
      DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_BASIC_AUTH_USERNAME:-}
      DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_BASIC_AUTH_PASSWORD:-}
      # The dashboard calls the agent for the campaign chat assistant and the
      # draft/research command actions, with the same Bearer the worker uses.
      # Without these the chat assistant fails with "AGENT_BASE_URL is not
      # configured".
      AGENT_BASE_URL: http://agent:8000
      AGENT_RUN_SECRET: ${AGENT_RUN_SECRET:-}
      RESEND_WEBHOOK_SECRET_DELIVERY: ${RESEND_WEBHOOK_SECRET_DELIVERY:-whsec_bG9jYWxfcmVzZW5kX2RlbGl2ZXJ5X3NlY3JldA==}
      RESEND_WEBHOOK_SECRET_INBOUND: ${RESEND_WEBHOOK_SECRET_INBOUND:-whsec_bG9jYWxfcmVzZW5kX2luYm91bmRfc2VjcmV0}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_DEFAULT_FROM_EMAIL: ${TELEGRAM_DEFAULT_FROM_EMAIL:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TIMEOUT_MS: ${OTEL_EXPORTER_OTLP_TIMEOUT_MS:-250}
    ports:
      - "0.0.0.0:55003:3000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
         cpus: '16'
         memory: 25600M
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const u=process.env.DASHBOARD_BASIC_AUTH_USERNAME||''; const p=process.env.DASHBOARD_BASIC_AUTH_PASSWORD||''; const headers={}; if(u&&p) headers.authorization='Basic '+Buffer.from(u+':'+p).toString('base64'); fetch('http://127.0.0.1:3000/health',{headers}).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://bizdev:bizdev@postgres:5432/bizdev
      WORKER_ID: docker-worker
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_LEASE_SECONDS: 180
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-300}
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
      WORKER_HEALTH_MAX_AGE_SECONDS: 30
      WORKER_POOLS: urgent,drafting,background
      AGENT_BASE_URL: http://agent:8000
      AGENT_RUN_SECRET: ${AGENT_RUN_SECRET:-}
      # The worker runs job.send_email via Resend, so it needs the API key.
      # The from-address is carried on the outbound message (set by the
      # dashboard at approve time); RESEND_FROM_EMAIL is a fallback.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RAG_EMBED_PROVIDER: ${RAG_EMBED_PROVIDER:-stub}
      VERTEX_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_RAG_EMBED_LOCATION: ${VERTEX_RAG_EMBED_LOCATION:-global}
      VERTEX_RAG_EMBED_MODEL: ${VERTEX_RAG_EMBED_MODEL:-gemini-embedding-2}
      VERTEX_RAG_EMBED_DIMENSIONS: ${VERTEX_RAG_EMBED_DIMENSIONS:-1536}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TIMEOUT_MS: ${OTEL_EXPORTER_OTLP_TIMEOUT_MS:-250}
    secrets:
      - source: gcp_sa_key
        target: /secrets/gcp-sa.json
        mode: 0444
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
         cpus: '16'
         memory: 25600M
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-telegram:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://bizdev:bizdev@postgres:5432/bizdev
      WORKER_ID: docker-worker-telegram
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_LEASE_SECONDS: 180
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-300}
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
      WORKER_HEALTH_MAX_AGE_SECONDS: 30
      WORKER_POOLS: telegram
      AGENT_BASE_URL: http://agent:8000
      AGENT_RUN_SECRET: ${AGENT_RUN_SECRET:-}
      RAG_EMBED_PROVIDER: ${RAG_EMBED_PROVIDER:-stub}
      VERTEX_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_RAG_EMBED_LOCATION: ${VERTEX_RAG_EMBED_LOCATION:-global}
      VERTEX_RAG_EMBED_MODEL: ${VERTEX_RAG_EMBED_MODEL:-gemini-embedding-2}
      VERTEX_RAG_EMBED_DIMENSIONS: ${VERTEX_RAG_EMBED_DIMENSIONS:-1536}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    secrets:
      - source: gcp_sa_key
        target: /secrets/gcp-sa.json
        mode: 0444
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
         cpus: '16'
         memory: 25600M
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      AGENT_PORT: 8000
      AGENT_RUN_SECRET: ${AGENT_RUN_SECRET:-}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-gemini-3.5-flash}
      # google_search built-in tool requires Gemini 2.x. ADK 1.33 + gemini-3
      # routes the call as a function_call which has no user-tool match and
      # fails. Pin search-stages to 2.5-flash until ADK lands gemini-3 grounding.
      AGENT_RESEARCH_SNAPSHOT_MODEL: ${AGENT_RESEARCH_SNAPSHOT_MODEL:-gemini-3.5-flash}
      AGENT_RESEARCH_SNAPSHOT_MODEL_FALLBACK: ${AGENT_RESEARCH_SNAPSHOT_MODEL_FALLBACK:-gemini-2.5-flash}
      AGENT_RESEARCH_MORE_MODEL: ${AGENT_RESEARCH_MORE_MODEL:-gemini-3.5-flash}
      AGENT_RESEARCH_MORE_MODEL_FALLBACK: ${AGENT_RESEARCH_MORE_MODEL_FALLBACK:-gemini-2.5-flash}
      AGENT_CAMPAIGN_DISCOVERY_MODEL: ${AGENT_CAMPAIGN_DISCOVERY_MODEL:-gemini-2.5-pro}
      AGENT_RESEARCH_QUALITY_GATE_MODEL: ${AGENT_RESEARCH_QUALITY_GATE_MODEL:-gemini-3.5-flash}
      AGENT_VALIDATE_CLAIMS_MODEL: ${AGENT_VALIDATE_CLAIMS_MODEL:-gemini-3.5-flash}
      AGENT_CLASSIFY_REPLY_MODEL: ${AGENT_CLASSIFY_REPLY_MODEL:-gemini-3.5-flash}
      AGENT_DRAFT_EMAIL_MODEL: ${AGENT_DRAFT_EMAIL_MODEL:-gemini-3.1-pro-preview}
      AGENT_DRAFT_WARM_EMAIL_MODEL: ${AGENT_DRAFT_WARM_EMAIL_MODEL:-gemini-3.1-pro-preview}
      AGENT_REVISE_EMAIL_MODEL: ${AGENT_REVISE_EMAIL_MODEL:-gemini-3.1-pro-preview}
      # T-026BF: failover models + retry tuning for 429 RESOURCE_EXHAUSTED.
      AGENT_DRAFT_EMAIL_MODEL_FALLBACK: ${AGENT_DRAFT_EMAIL_MODEL_FALLBACK:-gemini-3.5-flash}
      AGENT_DRAFT_WARM_EMAIL_MODEL_FALLBACK: ${AGENT_DRAFT_WARM_EMAIL_MODEL_FALLBACK:-gemini-3.5-flash}
      AGENT_REVISE_EMAIL_MODEL_FALLBACK: ${AGENT_REVISE_EMAIL_MODEL_FALLBACK:-gemini-3.5-flash}
      AGENT_DEFAULT_MODEL_FALLBACK: ${AGENT_DEFAULT_MODEL_FALLBACK:-}
      AGENT_RETRY_MAX_ATTEMPTS: ${AGENT_RETRY_MAX_ATTEMPTS:-3}
      AGENT_RETRY_BASE_DELAY_MS: ${AGENT_RETRY_BASE_DELAY_MS:-500}
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
    secrets:
      - source: gcp_sa_key
        target: /secrets/gcp-sa.json
        mode: 0444
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
         cpus: '16'
         memory: 25600M
    ports:
      - "0.0.0.0:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://bizdev:bizdev@postgres:5432/bizdev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  bizdev_postgres:
  bizdev_artifacts:

secrets:
  gcp_sa_key:
    file: ${HOST_GCP_SA_JSON:-/dev/null}
