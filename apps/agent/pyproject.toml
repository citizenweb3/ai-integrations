[project]
name = "bizdev-agent"
version = "0.0.0"
description = "ADK runtime for BizDev outreach agents"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
