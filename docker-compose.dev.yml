services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: logos-chatbot-postgres
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logos}
      POSTGRES_DB: logos_chatbot
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - logos_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/001-init-vector.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logos-chatbot-redis
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - logos_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: logos-chatbot-migrations
    command: yarn db:migrate
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://logos:${POSTGRES_PASSWORD:-logos}@postgres:5432/logos_chatbot
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: logos-chatbot-app
    command: yarn dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://logos:${POSTGRES_PASSWORD:-logos}@postgres:5432/logos_chatbot
      REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      RETRIEVAL_MOCK_EMBEDDINGS: ${RETRIEVAL_MOCK_EMBEDDINGS:-0}
    ports:
      - '127.0.0.1:3010:3000'
    volumes:
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.indexer
    container_name: logos-chatbot-indexer
    command: yarn indexer:start
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://logos:${POSTGRES_PASSWORD:-logos}@postgres:5432/logos_chatbot
      REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      INDEXER_MOCK_EMBEDDINGS: ${INDEXER_MOCK_EMBEDDINGS:-0}
    volumes:
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  logos_pg_data:
  logos_redis_data:
