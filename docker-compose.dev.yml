services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: logos-chatbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logos}
      POSTGRES_DB: ${POSTGRES_DB:-logos_chatbot}
    ports:
      - '55433:5432'
    volumes:
      - logos_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/001-init-vector.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logos-chatbot-redis
    ports:
      - '56379:6379'
    volumes:
      - logos_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: logos-chatbot-migrations
    command: yarn db:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logos}:${POSTGRES_PASSWORD:-logos}@postgres:5432/${POSTGRES_DB:-logos_chatbot}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: logos-chatbot-app
    command: yarn dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logos}:${POSTGRES_PASSWORD:-logos}@postgres:5432/${POSTGRES_DB:-logos_chatbot}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      ANSWER_MODEL: ${ANSWER_MODEL:-gemini-3-flash-preview}
      REWRITE_MODEL: ${REWRITE_MODEL:-gemini-2.5-flash}
      RERANK_MODEL: ${RERANK_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      RETRIEVAL_MOCK_EMBEDDINGS: ${RETRIEVAL_MOCK_EMBEDDINGS:-1}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3010}
      IP_HASH_SALT: ${IP_HASH_SALT:-development-only-ip-salt}
      RATE_LIMIT_PER_IP_PER_MINUTE: ${RATE_LIMIT_PER_IP_PER_MINUTE:-20}
      NODE_ENV: development
    ports:
      - '${APP_HOST_PORT:-3010}:3000'
    volumes:
      - ${HOST_GCP_SA_JSON:-/dev/null}:/secrets/gcp-sa.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.indexer
    container_name: logos-chatbot-indexer
    command: yarn indexer:start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logos}:${POSTGRES_PASSWORD:-logos}@postgres:5432/${POSTGRES_DB:-logos_chatbot}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      INDEXER_ENABLE_STATIC_SOURCE: ${INDEXER_ENABLE_STATIC_SOURCE:-1}
      INDEXER_ENABLE_RAW_GITHUB_SOURCES: ${INDEXER_ENABLE_RAW_GITHUB_SOURCES:-1}
      INDEXER_ENABLE_WEB_SOURCES: ${INDEXER_ENABLE_WEB_SOURCES:-1}
      INDEXER_ENABLE_GITHUB_SOURCES: ${INDEXER_ENABLE_GITHUB_SOURCES:-0}
      INDEXER_MOCK_EMBEDDINGS: ${INDEXER_MOCK_EMBEDDINGS:-1}
      INDEXER_STATIC_CRON: ${INDEXER_STATIC_CRON:-17 3 * * *}
      INDEXER_RAW_GITHUB_CRON: ${INDEXER_RAW_GITHUB_CRON:-37 3 * * *}
      INDEXER_WEB_CRON: ${INDEXER_WEB_CRON:-23 4 * * *}
      INDEXER_WEB_MAX_PAGES_PER_SOURCE: ${INDEXER_WEB_MAX_PAGES_PER_SOURCE:-12}
      INDEXER_GITHUB_CRON: ${INDEXER_GITHUB_CRON:-41 3 * * *}
      INDEXER_GITHUB_MAX_REPOS_PER_ORG: ${INDEXER_GITHUB_MAX_REPOS_PER_ORG:-120}
      INDEXER_GITHUB_MAX_FILES_PER_REPO: ${INDEXER_GITHUB_MAX_FILES_PER_REPO:-60}
      INDEXER_GITHUB_MAX_FILE_BYTES: ${INDEXER_GITHUB_MAX_FILE_BYTES:-1000000}
      INDEXER_GITHUB_REPO_ALLOWLIST: ${INDEXER_GITHUB_REPO_ALLOWLIST-}
      INDEXER_SHUTDOWN_GRACE_MS: ${INDEXER_SHUTDOWN_GRACE_MS:-25000}
      NODE_ENV: development
    volumes:
      - ${HOST_GCP_SA_JSON:-/dev/null}:/secrets/gcp-sa.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  logos_pg_data:
  logos_redis_data:
