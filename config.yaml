strategy:
  # "approval" — every message goes through approval bot, human approves
  # "auto"     — agent sends on its own, human gets notifications only (NOT IMPLEMENTED YET)
  mode: "approval"
  respond_enabled: true                  # enable claude-powered responses on keyword match

limits:
  messages_per_group_per_day: 10         # max responses per group per day
  min_delay_per_group: 60                # min seconds between responses in the same group
  typing_duration_min: 3                 # min typing simulation delay (seconds)
  typing_duration_max: 15                # max typing simulation delay (seconds)
  warmup_hours_min: 3                    # min warmup period after joining a group (hours)
  warmup_hours_max: 6                    # max warmup period after joining a group (hours)

proactive:
  interval_minutes: 30                   # run proactive scan every 30 minutes
  window_minutes: 45                     # analyze messages from the last 45 minutes
  score_threshold: 0.5                   # min score for a thread to be sent to claude
  max_candidates_per_cycle: 10           # max threads to evaluate per proactive cycle

claude:
  model: "claude-sonnet-4-6"                    # reactive (keyword match)
  effort: "medium"                              # reactive effort
  model_reply: "claude-opus-4-6"                # reply/DM (conversation continuation)
  effort_reply: "high"                          # reply effort
  model_verification: "claude-sonnet-4-6"       # verification of low-confidence drafts
  effort_verification: "high"                   # verification effort
  model_health: "claude-haiku-4-5-20251001"    # health check ping (JSON echo, no tools)
  effort_health: "low"                          # health check effort
  timeout_seconds: 120                          # subprocess timeout
  max_concurrent: 3                             # max parallel claude -p subprocesses
  degraded_pause_minutes: 15                    # pause after 3 consecutive failures

database:
  path: "data/agent.db"                  # sqlite database file path
  message_retention_hours: 48            # delete messages older than this
  audit_redaction_days: 90               # redact audit log payload after this many days

rag:
  timeout_seconds: 10                    # http timeout for RAG API requests
  max_retries: 2                         # retry count on failure
  circuit_breaker_threshold: 5           # consecutive failures before circuit opens
  circuit_breaker_cooldown_seconds: 300  # seconds before circuit breaker resets

validatorinfo_db:
  query_timeout_seconds: 5               # health check sql timeout

ollama:
  enabled: true
  url: "https://model.citizenweb3.com"
  token: ""
  model: "llama4:17b-scout-16e-instruct-q4_K_M"

  num_ctx: 8192
  num_predict: 256
  temperature: 0
  format: "json"
  keep_alive: -1

  warmup_on_start: true
  warmup_timeout_seconds: 180

  reactive_context_messages: 3
  proactive_context_messages: 30
  reactive_context_tokens: 5500
  proactive_context_tokens: 5500
  max_message_tokens: 700

  reactive_timeout_seconds: 120
  proactive_timeout_seconds: 240

  reactive_max_concurrent: 2
  proactive_max_concurrent: 1

  max_retries_reactive: 1
  max_retries_proactive: 2
  retry_delay_seconds: 5

  fallback_on_error: true
